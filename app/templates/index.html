<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo Website</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: {{ theme_color }};
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      margin-bottom: 24px;
      box-sizing: border-box;
    }
    .poster {
      max-width: 140px;
      border-radius: 8px;
      float: left;
      margin-right: 16px;
    }
    h1 { margin-top: 0; font-size: 20px; }
    .rating { color: #f5c518; font-weight: bold; }
    .usage-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0 4px;
      font-size: 14px;
    }
    .error { color: #ff8a80; font-size: 14px; }
    .clearfix::after { content: ""; display: table; clear: both; }
  </style>
</head>
<body>

  <div class="card clearfix">
    {% if movie.error %}
      <p class="error">{{ movie.error }}</p>
    {% else %}
      <img class="poster" src="{{ movie.poster }}" alt="{{ movie.title }} poster">
      <h1>{{ movie.title }} ({{ movie.year }})</h1>
      <p class="rating">IMDb {{ movie.rating }}/10</p>
      <p>{{ movie.genre }}</p>
      <p>{{ movie.plot }}</p>
    {% endif %}
  </div>

  <div class="card">
    <h1>Backstage pass: live pod usage</h1>
    <div id="usage-body">Loading...</div>
  </div>

  <script>
    const pollInterval = {{ poll_interval }} * 1000;

    async function refreshUsage() {
      const body = document.getElementById('usage-body');
      try {
        const res = await fetch('/api/usage');
        const data = await res.json();

        if (data.error) {
          body.innerHTML = `<p class="error">${data.error}</p>`;
          return;
        }

        body.innerHTML = `
          <div class="usage-row"><span>CPU</span><span>${data.cpu}</span></div>
          <div class="usage-row"><span>Memory</span><span>${data.memory}</span></div>
        `;
      } catch (e) {
        body.innerHTML = '<p class="error">Could not reach usage endpoint</p>';
      }
    }

    refreshUsage();
    setInterval(refreshUsage, pollInterval);
  </script>

</body>
</html>
