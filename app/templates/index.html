<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Maps your ConfigMap variable to a CSS variable */
      --base-bg: {{ theme_color }}; 
    }
    
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      /* Beautiful gradient using the injected theme color */
      background: linear-gradient(135deg, var(--base-bg) 0%, #000000 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    /* Glassmorphism Card Effect */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      max-width: 550px;
      width: 100%;
      margin-bottom: 30px;
      box-sizing: border-box;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Movie Info Layout */
    .movie-header {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
    }

    .poster {
      width: 150px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
      object-fit: cover;
    }

    .poster:hover {
      transform: scale(1.05);
    }

    .movie-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 { 
      margin: 0 0 12px 0; 
      font-size: 28px; 
      font-weight: 700;
      line-height: 1.2;
    }
    
    .badges {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .badge.imdb {
      background: #f5c518;
      color: #000;
    }

    .plot {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 24px;
    }

    /* Modern Gradient Button */
    .random-btn {
      background: linear-gradient(135deg, #f5c518 0%, #e0a800 100%);
      color: #121212;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(245, 197, 24, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .random-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 197, 24, 0.5);
    }

    /* Pod Usage Section */
    .usage-title {
      font-size: 18px;
      margin: 0 0 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .usage-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 15px;
      background: rgba(0,0,0,0.25);
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    
    .usage-row span:last-child {
      color: #4ade80; /* terminal green */
      font-family: monospace;
      font-size: 15px;
    }

    .error { color: #ff8a80; text-align: center; font-weight: 600; padding: 20px;}

    /* Mobile Responsive adjustments */
    @media (max-width: 500px) {
      .movie-header { flex-direction: column; align-items: center; text-align: center; }
      .badges { justify-content: center; }
      .poster { width: 180px; }
    }
  </style>
</head>
<body>

  <div class="card">
    {% if movie.error %}
      <div class="error">
        <h2>Oops!</h2>
        <p>{{ movie.error }}</p>
      </div>
    {% else %}
      
      <div class="movie-header">
        {% if movie.poster and movie.poster != 'N/A' %}
          <img class="poster" src="{{ movie.poster }}" alt="{{ movie.title }} poster">
        {% endif %}
        
        <div class="movie-info">
          <h1>{{ movie.title }}</h1>
          <div class="badges">
            <span class="badge imdb">★ {{ movie.rating }}</span>
            <span class="badge">{{ movie.year }}</span>
            <!-- Only grab the first genre if multiple are listed -->
            <span class="badge">{{ movie.genre.split(',')[0] }}</span>
          </div>
        </div>
      </div>
      
      <div class="plot">
        {{ movie.plot }}
      </div>
      
      <button class="random-btn" onclick="window.location.reload()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        Shuffle Movie
      </button>
      
    {% endif %}
  </div>

  <div class="card">
    <h2 class="usage-title">Cluster Telemetry</h2>
    <div id="usage-body">
      <div class="usage-row" style="justify-content: center; color: rgba(255,255,255,0.5);">Initializing metrics...</div>
    </div>
  </div>

  <script>
    const pollInterval = {{ poll_interval }} * 1000;

    async function refreshUsage() {
      const body = document.getElementById('usage-body');
      try {
        const res = await fetch('/api/usage');
        const data = await res.json();

        if (data.error) {
          body.innerHTML = `<div class="error">${data.error}</div>`;
          return;
        }

        body.innerHTML = `
          <div class="usage-row"><span>CPU Allocation</span><span>${data.cpu}</span></div>
          <div class="usage-row"><span>Memory Footprint</span><span>${data.memory}</span></div>
        `;
      } catch (e) {
        body.innerHTML = '<div class="error">Metrics server unreachable</div>';
      }
    }

    refreshUsage();
    setInterval(refreshUsage, pollInterval);
  </script>

</body>
</html>
