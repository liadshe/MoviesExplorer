apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-service
  labels:
    {{- include "demo-website-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "demo-website-chart.selectorLabels" . | nindent 4 }}
