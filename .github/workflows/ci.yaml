name: DevSecOps CI-Pipeline

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'chart/**'
      - 'README.md'

# Define variables once to avoid hardcoding throughout the pipeline
env:
  IMAGE_NAME: "liadshe/demo-website"
  CHART_DIR: "chart"

jobs:
  # JOB 1: Security & Code Analysis
  security-scans:
    name: Code Security (Gitleaks & SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r app --severity-level high

  # JOB 2: Build, Scan & Push
  build-scan-push:
    name: Build & Container Security
    needs: security-scans
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image (Local for scanning)
        uses: docker/build-push-action@v5
        with:
          context: app
          load: true 
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag_version.outputs.new_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ steps.tag_version.outputs.new_tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.tag_version.outputs.new_tag }}
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.tag_version.outputs.new_tag }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest

  # JOB 3: Manifest Update
  update-gitops-repo:
    name: Trigger GitOps Sync
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Helm values with new image tag
        run: |
          sed -i "s/tag: .*/tag: \"${{ needs.build-scan-push.outputs.new_tag }}\"/g" ${{ env.CHART_DIR }}/values.yaml         
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ${{ env.CHART_DIR }}/values.yaml
          git commit -m "chore: update image tag to ${{ needs.build-scan-push.outputs.new_tag }} [skip ci]"
          git push