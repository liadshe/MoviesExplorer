name: DevSecOps CI-Pipeline

on:
  push:
    branches:
      - main
      - dev
    # Ignore changes to the Helm chart to prevent infinite deployment loops
    paths-ignore:
      - 'demo-website-chart/**'
      - 'README.md'

jobs:
  devsecops-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push tags and commit Helm chart updates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for version bumping to read git history

      # --- 00. GITLEAKS ---

      - name: Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 01. SAST STAGE ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Bandit (Static Application Security Testing)
        run: |
          pip install bandit
          # Scans the directory. Fails the pipeline if HIGH severity issues are found.
          bandit -r app --severity-level high

      # --- 02. VERSION BUMPING STAGE ---
      - name: Bump version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      # --- 03. IMAGE SCANNING STAGE ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Local for scanning)
        uses: docker/build-push-action@v5
        with:
          context: app
          load: true # Crucial: Loads image into local Docker daemon so Trivy can scan it
          tags: liadshe/demo-website:${{ steps.tag_version.outputs.new_tag }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'liadshe/demo-website:${{ steps.tag_version.outputs.new_tag }}'
          format: 'table'
          exit-code: '1' # Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # --- PUSH & GITOPS STAGE ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push liadshe/demo-website:${{ steps.tag_version.outputs.new_tag }}
          docker tag liadshe/demo-website:${{ steps.tag_version.outputs.new_tag }} liadshe/demo-website:latest
          docker push liadshe/demo-website:latest

      - name: Update Helm values with new image tag
        run: |
          # Automatically update values.yaml with the secure, bumped version
          sed -i "s/tag: .*/tag: \"${{ steps.tag_version.outputs.new_tag }}\"/g" demo-website-chart/values.yaml
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add demo-website-chart/values.yaml
          git commit -m "chore: update image tag to ${{ steps.tag_version.outputs.new_tag }} [skip ci]"
          git push